name: little_blue_truck_timer
description: "Timer app for preschool with Little Blue Truck animation"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  video_player: ^2.8.0
  audioplayers: ^5.2.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  flutter_timezone: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/Assets/
    - little_blue_truck_mini_sequence.mp4
